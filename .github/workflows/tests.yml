name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_sqlite
          coverage: none

      - name: Beispielkonfiguration anlegen
        run: |
          cp includes/config.example.php includes/config.php
          cp includes/api_config.example.php includes/api_config.php

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests ausführen
        run: php tests/run_tests.php
