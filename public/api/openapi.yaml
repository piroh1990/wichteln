openapi: 3.0.3
info:
  title: Wichtlä.ch API
  description: |
    REST API for the Wichtlä.ch Platform - Secret Santa / Wichteln Online Tool
    
    ## Authentication
    All endpoints (except `/`) require an API token:
    - **Bearer Token**: `Authorization: Bearer YOUR_TOKEN`
    - **X-API-Token Header**: `X-API-Token: YOUR_TOKEN`
    - **Query Parameter**: `?api_token=YOUR_TOKEN` (development only)
    
    ## Rate Limiting
    - 60 requests per minute per IP address
    - On exceed: HTTP 429 Response
    
    ## CORS
    - Cross-Origin Requests are supported
    - Preflight (OPTIONS) Requests are handled automatically
  version: 1.0.0
  contact:
    name: GitHub Repository
    url: https://github.com/piroh1990/wichteln
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://wichtlä.ch/api
    description: Production Server
  - url: http://localhost/wichtel/api
    description: Local Development

tags:
  - name: groups
    description: Management of Secret Santa groups
  - name: participants
    description: Management of participants
  - name: draw
    description: Perform and reset the draw
  - name: exclusions
    description: Management of exclusions
  - name: info
    description: API Information

security:
  - BearerAuth: []
  - ApiKeyHeader: []
  - ApiKeyQuery: []

paths:
  /:
    get:
      tags:
        - info
      summary: API Information
      description: Returns information about available endpoints (no token required)
      security: []
      responses:
        '200':
          description: API Information successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'

  /groups.php:
    get:
      tags:
        - groups
      summary: Retrieve Groups
      description: List of all groups or a single group by ID/Token
      parameters:
        - name: id
          in: query
          schema:
            type: integer
          description: Retrieve group by ID
        - name: admin_token
          in: query
          schema:
            type: string
          description: Retrieve group by Admin Token
        - name: invite_token
          in: query
          schema:
            type: string
          description: Retrieve group by Invite Token
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GroupListResponse'
                  - $ref: '#/components/schemas/GroupDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

    post:
      tags:
        - groups
      summary: Create Group
      description: Creates a new Secret Santa group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

    put:
      tags:
        - groups
      summary: Update Group
      description: Updates budget, description, or date of a group
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the group to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - groups
      summary: Delete Group
      description: Deletes a group and all associated participants and exclusions
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the group to delete
      responses:
        '200':
          description: Group successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /participants.php:
    get:
      tags:
        - participants
      summary: Retrieve Participants
      description: List of all participants or a single participant
      parameters:
        - name: group_id
          in: query
          schema:
            type: integer
          description: All participants of a group
        - name: id
          in: query
          schema:
            type: integer
          description: Participant by ID
        - name: token
          in: query
          schema:
            type: string
          description: Participant by Token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ParticipantListResponse'
                  - $ref: '#/components/schemas/ParticipantDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - participants
      summary: Create Participant
      description: Registers a new participant in a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipantRequest'
      responses:
        '201':
          description: Participant successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateParticipantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - participants
      summary: Update Participant
      description: Updates participant data (only wishlist after draw)
      parameters:
        - name: id
          in: query
          schema:
            type: integer
          description: Participant ID
        - name: token
          in: query
          schema:
            type: string
          description: Participant Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParticipantRequest'
      responses:
        '200':
          description: Participant successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - participants
      summary: Delete Participant
      description: Deletes a participant (only before the draw)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the participant to delete
      responses:
        '200':
          description: Participant successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /draw.php:
    post:
      tags:
        - draw
      summary: Perform or Reset Draw
      description: |
        Performs the Secret Santa draw or resets it
        - Default: Perform draw
        - With `?action=reset`: Reset draw
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [reset]
          description: "Action: 'reset' to reset the draw"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DrawRequest'
                - $ref: '#/components/schemas/ResetDrawRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DrawResponse'
                  - $ref: '#/components/schemas/ResetDrawResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /exclusions.php:
    get:
      tags:
        - exclusions
      summary: Retrieve Exclusions
      description: List of all exclusions for a group
      parameters:
        - name: group_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the group
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - exclusions
      summary: Create Exclusion
      description: Creates a new exclusion (only before the draw)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExclusionRequest'
      responses:
        '201':
          description: Exclusion successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - exclusions
      summary: Delete Exclusion
      description: Deletes an exclusion (only before the draw)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the exclusion to delete
      responses:
        '200':
          description: Exclusion successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer Token in Authorization Header
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Token
      description: API Token in X-API-Token Header
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_token
      description: API Token as Query Parameter (development only)

  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Secret Santa 2025"
        admin_token:
          type: string
          example: "abc123def456..."
        invite_token:
          type: string
          example: "xyz789uvw012..."
        admin_email:
          type: string
          format: email
          example: "admin@example.com"
        budget:
          type: string
          example: "25.00"
        description:
          type: string
          nullable: true
          example: "Office Party"
        gift_exchange_date:
          type: string
          format: date
          example: "2025-12-24"
        is_drawn:
          type: integer
          enum: [0, 1]
          example: 0
        created_at:
          type: string
          format: date-time
          example: "2025-10-10 12:00:00"

    Participant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        group_id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        token:
          type: string
          example: "part123token456..."
        assigned_to:
          type: integer
          nullable: true
          example: 2
        wishlist:
          type: string
          nullable: true
          example: "Books, Chocolate"
        created_at:
          type: string
          format: date-time
          example: "2025-10-10 12:00:00"

    Exclusion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        participant_id:
          type: integer
          example: 1
        excluded_participant_id:
          type: integer
          example: 2
        participant_name:
          type: string
          example: "John Doe"
        excluded_name:
          type: string
          example: "Jane Example"
        created_at:
          type: string
          format: date-time
          example: "2025-10-10 12:00:00"

    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Secret Santa 2025"
        admin_email:
          type: string
          format: email
          example: "admin@example.com"
        budget:
          type: number
          format: float
          example: 25.00
        description:
          type: string
          example: "Office Party"
        gift_exchange_date:
          type: string
          format: date
          example: "2025-12-24"

    UpdateGroupRequest:
      type: object
      properties:
        budget:
          type: number
          format: float
          example: 30.00
        description:
          type: string
          example: "New text"
        gift_exchange_date:
          type: string
          format: date
          example: "2025-12-25"

    CreateParticipantRequest:
      type: object
      required:
        - group_id
        - name
        - email
      properties:
        group_id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        wishlist:
          type: string
          example: "Books, Chocolate"

    UpdateParticipantRequest:
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        wishlist:
          type: string
          example: "New Wishlist"

    CreateExclusionRequest:
      type: object
      required:
        - group_id
        - participant_id
        - excluded_participant_id
      properties:
        group_id:
          type: integer
          example: 1
        participant_id:
          type: integer
          example: 1
        excluded_participant_id:
          type: integer
          example: 2

    DrawRequest:
      type: object
      required:
        - group_id
      properties:
        group_id:
          type: integer
          example: 1
        send_emails:
          type: boolean
          default: true
          example: true

    ResetDrawRequest:
      type: object
      required:
        - group_id
      properties:
        group_id:
          type: integer
          example: 1

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Success"
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      properties:
        timestamp:
          type: integer
          example: 1696939200
        version:
          type: string
          example: "v1"
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 5
        total_pages:
          type: integer
          example: 1
        has_more:
          type: boolean
          example: false

    ApiInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                version:
                  type: string
                  example: "v1"
                status:
                  type: string
                  example: "online"
                base_url:
                  type: string
                  example: "https://wichtlä.ch/api/"
                endpoints:
                  type: array
                  items:
                    type: object

    GroupListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Group'

    GroupDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Group'
                - type: object
                  properties:
                    participants:
                      type: array
                      items:
                        $ref: '#/components/schemas/Participant'
                    exclusions:
                      type: array
                      items:
                        $ref: '#/components/schemas/Exclusion'

    GroupResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Group'

    CreateGroupResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                admin_token:
                  type: string
                invite_token:
                  type: string
                admin_link:
                  type: string
                invite_link:
                  type: string

    DeleteGroupResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                deleted_group_id:
                  type: integer
                deleted_participants:
                  type: integer
                deleted_exclusions:
                  type: integer

    ParticipantListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Participant'

    ParticipantDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Participant'
                - type: object
                  properties:
                    assigned_partner:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        wishlist:
                          type: string
                    group:
                      $ref: '#/components/schemas/Group'

    ParticipantResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Participant'

    CreateParticipantResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                token:
                  type: string
                participant_link:
                  type: string

    ExclusionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Exclusion'

    ExclusionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Exclusion'

    DrawResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                group_id:
                  type: integer
                is_drawn:
                  type: boolean
                participants_count:
                  type: integer
                attempts_needed:
                  type: integer
                emails_sent:
                  type: integer
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      giver_id:
                        type: integer
                      receiver_id:
                        type: integer

    ResetDrawResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                group_id:
                  type: integer
                is_drawn:
                  type: boolean
                reset_participants:
                  type: integer

    DeleteResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error processing the request"
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Missing required fields"
            data: null

    Unauthorized:
      description: Invalid or missing API Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Invalid or missing API Token"
            data: null

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Resource not found"
            data: null

    RateLimitExceeded:
      description: Rate Limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Rate Limit exceeded. Please wait a minute."
            data: null
